name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The bundle half of CI: continuous build. It checks the manifest contract and
  # then builds the exact archive the release workflow would publish, so a broken
  # package fails on the push that introduced it rather than at tag time.
  bundle:
    name: Bundle contract (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor package.json declares, 24 is the runtime the desktop
        # app actually ships — the two ends of the supported range.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: bundle contract
        run: node scripts/verify-bundle.mjs

  # Release-contract half of CI: the things a shape check cannot see. The bundle
  # contract above proves the package *loads*; this proves it is safe to publish
  # (metadata a public release needs, no author paths or credentials in the tree),
  # that the browser half still respects the current dsh API surface, and that the
  # counts quoted in README.md are the ones the Host half actually exports — so
  # document drift is a red build rather than a reader's first dead end.
  contract:
    name: Release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: runtime contract and documented counts
        run: node scripts/verify-package.mjs
      - name: publish guards
        run: node scripts/verify-publish-guards.mjs
      - name: packed tarball carries every runtime file
        run: |
          set -euo pipefail
          npm pack --silent >/dev/null
          TGZ="$(ls -1 *.tgz | head -n1)"
          test -n "$TGZ"
          tar -xzf "$TGZ" -C .
          NAME="$(node -p 'require("./package.json").name')"
          for f in lib/index.js lib/client.js cordis.patch.yml package.json LICENSE NOTICE PROVENANCE.md vendor/uisfx-0.4.0.js; do
            test -f "package/$f" || { echo "missing from the packed tarball: $f"; exit 1; }
          done
          echo "packed tarball ($TGZ) contains every runtime file"

  package:
    name: Build the release package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: verify the bundle contract
        run: node scripts/verify-bundle.mjs
      - name: build the package
        run: |
          set -euo pipefail
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          mkdir -p dist
          git archive --format=zip --prefix="${NAME}-${VERSION}/" -o "dist/${NAME}-${VERSION}.zip" "$GITHUB_SHA"
          # Two shapes: the zip is the whole tree (readable, diffable), the npm
          # tarball is the one `dsh plugin add file:<tarball>` installs — which is
          # what "download and use" has to mean for someone else.
          npm pack --pack-destination dist >/dev/null
          (cd dist && sha256sum "${NAME}-${VERSION}.zip" "${NAME}-${VERSION}.tgz" > SHA256SUMS.txt)
          ls -l dist
      - name: prove the archive is a complete package
        run: |
          set -euo pipefail
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          STAGE="$(mktemp -d)"
          unzip -q "dist/${NAME}-${VERSION}.zip" -d "$STAGE"
          node "$STAGE/${NAME}-${VERSION}/scripts/verify-bundle.mjs" "$STAGE/${NAME}-${VERSION}"

      - name: Prove the tarball is self-contained
        run: |
          set -euo pipefail
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          STAGE="$(mktemp -d)"
          tar -xzf "dist/${NAME}-${VERSION}.tgz" -C "$STAGE"
          # `npm pack` carries only the `files` allow-list, so this is the check that
          # the allow-list is complete: the manifest and the bundle patch must be in
          # the package, and the package must satisfy its own contract outside the
          # checkout it was built from.
          test -f "$STAGE/package/package.json"
          test -f "$STAGE/package/cordis.patch.yml"
          node "$STAGE/package/scripts/verify-bundle.mjs" "$STAGE/package"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30
